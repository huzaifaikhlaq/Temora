services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U temora -d identity
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ./services/identity-service

    restart: unless-stopped

    env_file:
      - ./services/identity-service/.env
    environment:
      TEMORA_ENVIRONMENT: ${TEMORA_ENVIRONMENT:-}
      TEMORA_SEEDING_ENABLED: ${TEMORA_SEEDING_ENABLED:-false}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      

  worker:
    build:
      context: ./services/identity-service

    restart: unless-stopped

    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=2
      -Q identity

    env_file:
      - ./services/identity-service/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
   
  workspace:
    build:
      context: ./services/workspace-service

    restart: unless-stopped

    env_file:
      - ./services/workspace-service/.env
    environment:
      TEMORA_ENVIRONMENT: ${TEMORA_ENVIRONMENT:-}
      TEMORA_SEEDING_ENABLED: ${TEMORA_SEEDING_ENABLED:-false}

    ports:
      - "127.0.0.1:8001:8000"

    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started 

  workspace-worker:
    build:
      context: ./services/workspace-service

    restart: unless-stopped

    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=2

    env_file:
      - ./services/workspace-service/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  
  project:
    build:
      context: ./services/project-service

    restart: unless-stopped

    env_file:
      - ./services/project-service/.env
    environment:
      TEMORA_ENVIRONMENT: ${TEMORA_ENVIRONMENT:-}
      TEMORA_SEEDING_ENABLED: ${TEMORA_SEEDING_ENABLED:-false}

    ports:
      - "127.0.0.1:8002:8000"

    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      workspace:
        condition: service_started

 
  issue:
    build:
      context: ./services/issue-service

    restart: unless-stopped

    env_file:
      - ./services/issue-service/.env
    environment:
      TEMORA_ENVIRONMENT: ${TEMORA_ENVIRONMENT:-}
      TEMORA_SEEDING_ENABLED: ${TEMORA_SEEDING_ENABLED:-false}

    ports:
      - "127.0.0.1:8003:8000"

    volumes:
      - issue_media:/app/media

    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      workspace:
        condition: service_started
      project:
        condition: service_started

  sprint:
    build:
      context: ./services/sprint-service

    restart: unless-stopped

    env_file:
      - ./services/sprint-service/.env

    ports:
      - "127.0.0.1:8004:8000"

    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      workspace:
        condition: service_started
      project:
        condition: service_started
      issue:
        condition: service_started
  
  billing:
    build:
      context: ./services/billing-service

    restart: unless-stopped

    env_file:
         - ./services/billing-service/.env

    ports:
         - "127.0.0.1:8005:8000"

    depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
        identity:
          condition: service_started
        workspace:
           condition: service_started

  billing-worker:
    build:
      context: ./services/billing-service

    restart: unless-stopped

    command: >
      celery -A config worker
      -Q billing
      --loglevel=info
      --concurrency=2

    env_file:
      - ./services/billing-service/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      billing:
        condition: service_started

  billing-beat:
    build:
      context: ./services/billing-service

    restart: unless-stopped

    command: >
      celery -A config beat
      --loglevel=info
      --schedule=/tmp/billing-celerybeat-schedule

    env_file:
      - ./services/billing-service/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      billing:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  issue_media:

  
