services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data:
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U temora -d identity
        interval: 5s
        retries: 15

  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:6379:6379"
      
    volumes:
      - redis_data:/data

  identity:
    build: ./services/identity-service

    env_file:
      - ./services/identity-service/.env

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./services/identity-service

    command: >
      celery -A config worker
      --loglevel=info
      --concurrency=2

    env_file:
      - ./services/identity-service/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
